services:
  postgres:
    image: postgres:16-alpine
    container_name: tan90-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_platform
      POSTGRES_USER: tan90user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - tan90net

  tan90:
    build: .
    container_name: tan90-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: video_platform
      DB_USER: tan90user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      PLATFORM_NAME: tan90
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      PAYU_MERCHANT_KEY: ${PAYU_MERCHANT_KEY}
      PAYU_MERCHANT_SALT: ${PAYU_MERCHANT_SALT}
      PAYU_BASE_URL: ${PAYU_BASE_URL}
      SUBSCRIPTION_AMOUNT: ${SUBSCRIPTION_AMOUNT}
      FRONTEND_URL: ${FRONTEND_URL}
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD}
    volumes:
      - /storage/tan90/uploads:/app/uploads
      - /var/run/clamav/clamd.ctl:/var/run/clamav/clamd.ctl
    networks:
      - tan90net

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: tan90-jellyfin
    restart: unless-stopped
    user: "0:0"
    group_add:
      - "993"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /storage/tan90/uploads/mkv:/media:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    networks:
      - tan90net
    ports:
      - "8096:8096"

  nginx:
    image: nginx:alpine
    container_name: tan90-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tan90
    networks:
      - tan90net

volumes:
  postgres_data:
  jellyfin_config:
  jellyfin_cache:

networks:
  tan90net:
    driver: bridge
