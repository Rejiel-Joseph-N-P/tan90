<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tan90 — Forgot Password</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap");
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", sans-serif;
      background: #080808; color: #fff; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background-image: radial-gradient(ellipse at 50% 0%, #1a1a1a 0%, #080808 70%);
    }
    .wrapper { width: 100%; max-width: 420px; padding: 24px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand-logo {
      font-size: 36px; font-weight: 700; letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-tagline { color: #555; font-size: 13px; margin-top: 6px; }
    .card {
      background: #111; border: 1px solid #222;
      border-radius: 16px; padding: 36px;
    }
    .card h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .card p { color: #555; font-size: 13px; margin-bottom: 28px; line-height: 1.6; }
    label {
      display: block; font-size: 12px; font-weight: 500;
      color: #888; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    input {
      width: 100%; padding: 13px 16px; background: #1a1a1a;
      border: 1px solid #2a2a2a; border-radius: 10px; color: #fff;
      font-size: 14px; font-family: "Space Grotesk", sans-serif;
      outline: none; transition: border-color 0.2s; margin-bottom: 18px;
    }
    input:focus { border-color: #444; }
    input::placeholder { color: #444; }
    .btn {
      width: 100%; padding: 14px; background: #fff; color: #000;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
      font-family: "Space Grotesk", sans-serif; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #e8e8e8; }
    .btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
    .back-link {
      display: block; text-align: center; margin-top: 20px;
      color: #555; font-size: 13px; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #aaa; }
    .msg-box {
      padding: 12px 16px; border-radius: 10px; font-size: 13px;
      margin-bottom: 18px; display: none;
    }
    .msg-success {
      background: #0a2a0a; border: 1px solid #1a4a1a; color: #4caf50;
    }
    .msg-error {
      background: #1a0a0a; border: 1px solid #3a1a1a; color: #ff6b6b;
    }
    .success-view { text-align: center; display: none; }
    .success-icon {
      width: 64px; height: 64px; background: #0a2a0a;
      border: 2px solid #1a4a1a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
  
/* Eye button alignment fix */
.eye-btn {
  position: absolute !important;
  right: 14px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  min-height: unset !important;
  height: auto !important;
  width: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  background: none !important;
  border: none !important;
}

.password-wrapper {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
}

.password-wrapper input {
  padding-right: 48px !important;
  width: 100% !important;
}

  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <div class="brand-logo">tan90</div>
      <div class="brand-tagline">Private Video Platform</div>
    </div>
    <div class="card">
      <div id="formView">
        <h2>Forgot Password</h2>
        <p>Enter your registered email address and we'll send you a link to reset your password.</p>
        <div class="msg-box msg-error" id="errorBox"></div>
        <label>Email Address</label>
        <input type="email" id="email" placeholder="yourname@gmail.com" />
        <button class="btn" id="submitBtn" onclick="sendReset()">Send Reset Link</button>
      </div>
      <div class="success-view" id="successView">
        <div class="success-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
            viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2 style="margin-bottom:10px">Check Your Email</h2>
        <p>If that email is registered, a password reset link has been sent. Check your inbox and spam folder.</p>
      </div>
    </div>
    <a href="login.html" class="back-link">← Back to Sign In</a>
  </div>
  <script>
    async function sendReset() {
      const email = document.getElementById("email").value.trim();
      const errorBox = document.getElementById("errorBox");
      const btn = document.getElementById("submitBtn");
      errorBox.style.display = "none";

      if (!email) {
        errorBox.textContent = "Please enter your email address";
        errorBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const res = await fetch(`${CONFIG.API_BASE}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("formView").style.display = "none";
          document.getElementById("successView").style.display = "block";
        } else {
          errorBox.textContent = data.message;
          errorBox.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Send Reset Link";
        }
      } catch (err) {
        errorBox.textContent = "Cannot connect to server";
        errorBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") sendReset();
    });
  </script>
</body>
</html>
