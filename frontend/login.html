<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tan90 - Sign In</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #080808;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 50% 0%, #1a1a1a 0%, #080808 70%);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      color: #555;
      font-size: 13px;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .login-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 36px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-card p {
      color: #555;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-family: "DM Sans", sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #444;
    }

    input::placeholder {
      color: #444;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .eye-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .eye-btn:hover {
      color: #aaa;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: "DM Sans", sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #e8e8e8;
    }

    .login-btn:disabled {
      background: #2a2a2a;
      color: #555;
      cursor: not-allowed;
    }

    .request-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #555;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .request-link:hover {
      color: #aaa;
    }

    .error-box {
      background: #1a0a0a;
      border: 1px solid #3a1a1a;
      color: #ff6b6b;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }

    .footer-text {
      text-align: center;
      color: #333;
      font-size: 12px;
      margin-top: 24px;
    }
  
/* Eye button alignment fix */
.eye-btn {
  position: absolute !important;
  right: 14px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  min-height: unset !important;
  height: auto !important;
  width: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  background: none !important;
  border: none !important;
}

.password-wrapper {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
}

.password-wrapper input {
  padding-right: 48px !important;
  width: 100% !important;
}

  </style>
  <link rel="stylesheet" href="/mobile.css">
</head>

<body>

  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-logo">tan90</div>
      <div class="brand-tagline">Private Video Platform</div>
    </div>

    <div class="login-card">
      <h2>Welcome back</h2>
      <p>Sign in to access your content</p>

      <div class="error-box" id="errorBox"></div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <button class="eye-btn" type="button" onclick="togglePassword()" id="eyeBtn">
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="display:none">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button class="login-btn" id="loginBtn" onclick="login()">Sign In</button>
      <a href="forgot-password.html" class="request-link" style="margin-top:10px">Forgot password?</a>
      <a href="request-access.html" class="request-link">New here? Request Access →</a>
    </div>

    <div class="footer-text">tan90 · Private Access Only</div>
  </div>

  <script>
    if (localStorage.getItem("token")) {
      window.location.href = "home.html";
    }

    function togglePassword() {
      const input = document.getElementById("password");
      const eyeOpen = document.getElementById("eyeOpen");
      const eyeClosed = document.getElementById("eyeClosed");

      if (input.type === "password") {
        input.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
      } else {
        input.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
      }
    }

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("errorBox");
      const loginBtn = document.getElementById("loginBtn");

      errorBox.style.display = "none";

      if (!username || !password) {
        errorBox.textContent = "Please enter both username and password";
        errorBox.style.display = "block";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        const response = await fetch(`${CONFIG.API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = "home.html";
        } else {
          errorBox.textContent = data.message || "Invalid credentials";
          errorBox.style.display = "block";
        }

      } catch (err) {
        errorBox.textContent = "Cannot connect to server";
        errorBox.style.display = "block";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>

</body>

</html>
