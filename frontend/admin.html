<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tan90 — Admin Dashboard</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    nav {
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-brand span {
      color: #555;
      font-weight: 400;
      font-size: 13px;
      margin-left: 10px;
      -webkit-text-fill-color: #555;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #888;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: "DM Sans", sans-serif;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #222;
      color: #fff;
    }

    main {
      padding: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .page-subtitle {
      color: #555;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .stat-label {
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 4px;
      width: fit-content;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #555;
      font-size: 13px;
      font-family: "DM Sans", sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .tab-btn.active {
      background: #222;
      color: #fff;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #888;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #555;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: "DM Sans", sans-serif;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: #444;
      color: #aaa;
    }

    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-row {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #161616;
    }

    .card-row:last-child {
      border-bottom: none;
    }

    .card-info {
      flex: 1;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 12px;
      color: #444;
      line-height: 1.6;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: "DM Sans", sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-approve {
      background: #0f2a0f;
      color: #4caf50;
      border: 1px solid #1a4a1a;
    }

    .btn-approve:hover {
      background: #1a3a1a;
    }

    .btn-reject {
      background: #2a0f0f;
      color: #ff6b6b;
      border: 1px solid #4a1a1a;
    }

    .btn-reject:hover {
      background: #3a1a1a;
    }

    .btn-delete {
      background: #2a0f0f;
      color: #ff6b6b;
      border: 1px solid #4a1a1a;
    }

    .btn-delete:hover {
      background: #3a1a1a;
    }

    .btn-seen {
      background: #1a1a2a;
      color: #888aff;
      border: 1px solid #2a2a4a;
    }

    .btn-seen:hover {
      background: #2a2a3a;
    }

    .btn-sub {
      background: #0f2a1f;
      color: #4caf50;
      border: 1px solid #1a4a2a;
    }

    .btn-sub:hover {
      background: #1a3a2a;
    }

    .btn-unsub {
      background: #2a1a0f;
      color: #f0a500;
      border: 1px solid #4a3010;
    }

    .btn-unsub:hover {
      background: #3a2a1a;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    .badge-pending {
      background: #2a1a00;
      color: #f0a500;
      border: 1px solid #4a3000;
    }

    .badge-approved {
      background: #0a2a0a;
      color: #4caf50;
      border: 1px solid #1a4a1a;
    }

    .badge-rejected {
      background: #2a0a0a;
      color: #ff6b6b;
      border: 1px solid #4a1a1a;
    }

    .badge-seen {
      background: #0a1a2a;
      color: #64b5f6;
      border: 1px solid #1a3a5a;
    }

    .badge-admin {
      background: #2a1a00;
      color: #f0a500;
      border: 1px solid #4a3000;
    }

    .badge-viewer {
      background: #1a1a2a;
      color: #888aff;
      border: 1px solid #2a2a4a;
    }

    .badge-sub {
      background: #0a2a0a;
      color: #4caf50;
      border: 1px solid #1a4a1a;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: #333;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 999;
      display: none;
    }
  </style>
  <link rel="stylesheet" href="/mobile.css">
</head>

<body>

  <nav>
    <a href="home.html" class="nav-brand" style="text-decoration:none">tan90 <span>Admin</span></a>
    <div class="nav-right">
      <a href="home.html" class="nav-btn">Home</a>
      <a href="admin-profile.html" class="nav-btn">Profile</a>
      <button class="nav-btn" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <main>
    <div class="page-title">Dashboard</div>
    <div class="page-subtitle">Manage access, users, subscriptions and content requests</div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Users</div>
        <div class="stat-value" id="statUsers">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Access</div>
        <div class="stat-value" id="statPending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Videos</div>
        <div class="stat-value" id="statVideos">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Video Requests</div>
        <div class="stat-value" id="statVidReq">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Subscribed</div>
        <div class="stat-value" id="statSubs">—</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('access', this)">Access Requests</button>
      <button class="tab-btn" onclick="switchTab('users', this)">Users</button>
      <button class="tab-btn" onclick="switchTab('videoreqs', this)">Video Requests</button>
      <button class="tab-btn" onclick="switchTab('messages', this)">Messages</button>
      <button class="tab-btn" onclick="switchTab('subrequests', this)">Subscriptions</button>
    </div>

    <!-- ACCESS REQUESTS -->
    <div class="tab-panel active" id="tab-access">
      <div class="section-header">
        <div class="section-title">Access Requests</div>
        <button class="refresh-btn" onclick="loadAccessRequests()">Refresh</button>
      </div>
      <div id="accessList"></div>
    </div>

    <!-- SUBSCRIPTION REQUESTS -->
    <div class="tab-panel" id="tab-subrequests">
      <div class="section-header">
        <div class="section-title">Subscription Requests (50₹/month)</div>
        <button class="refresh-btn" onclick="loadSubRequests()">Refresh</button>
      </div>
      <div id="subRequestsList"></div>
    </div>

    <!-- USERS -->
    <div class="tab-panel" id="tab-users">
      <div class="section-header">
        <div class="section-title">All Users</div>
        <button class="refresh-btn" onclick="loadUsers()">Refresh</button>
      </div>
      <div id="usersList"></div>
    </div>

    <!-- VIDEO REQUESTS -->
    <div class="tab-panel" id="tab-videoreqs">
      <div class="section-header">
        <div class="section-title">Video Upload Requests</div>
        <button class="refresh-btn" onclick="loadVideoRequests()">Refresh</button>
      </div>
      <div id="videoReqsList"></div>
    </div>

    <!-- MESSAGES -->
    <div class="tab-panel" id="tab-messages">
      <div class="section-header">
        <div class="section-title">User Messages</div>
        <button class="refresh-btn" onclick="loadMessages()">Refresh</button>
      </div>
      <div id="messagesList"></div>
    </div>

  </main>

  <div class="toast" id="toast"></div>
  <script>
    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    if (!token || user.role !== "admin") window.location.href = "login.html";

    function switchTab(tab, btn) {
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(`tab-${tab}`).classList.add("active");
      btn.classList.add("active");
      if (tab === "access") loadAccessRequests();
      if (tab === "users") loadUsers();
      if (tab === "videoreqs") loadVideoRequests();
      if (tab === "subrequests") loadSubRequests();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    async function loadStats() {
      try {
        const [u, v, a, vr] = await Promise.all([
          fetch(`${CONFIG.API_BASE}/api/admin/users`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${CONFIG.API_BASE}/api/videos`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${CONFIG.API_BASE}/api/access/requests`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${CONFIG.API_BASE}/api/videorequests/all`, { headers: { Authorization: `Bearer ${token}` } })
        ]);

        const users = await u.json();
        const videos = await v.json();
        const access = await a.json();
        const vidreqs = await vr.json();

        document.getElementById("statUsers").textContent = users.users?.length || 0;
        document.getElementById("statVideos").textContent = videos.videos?.length || 0;
        document.getElementById("statPending").textContent =
          access.requests?.filter(r => r.status === "pending").length || 0;
        document.getElementById("statVidReq").textContent =
          vidreqs.requests?.filter(r => r.status === "pending").length || 0;
        document.getElementById("statSubs").textContent =
          users.users?.filter(u => u.subscribed).length || 0;

      } catch (err) { console.error("Stats error:", err); }
    }

    // ACCESS REQUESTS
    async function loadAccessRequests() {
      const res = await fetch(`${CONFIG.API_BASE}/api/access/requests`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById("accessList");

      if (!data.requests?.length) {
        list.innerHTML = '<div class="empty-state">No access requests</div>'; return;
      }

      list.innerHTML = `<div class="card">${data.requests.map(r => `
      <div class="card-row">
        <div class="card-info">
          <div class="card-name">${r.full_name}
            <span class="badge badge-${r.status}">${r.status}</span>
          </div>
          <div class="card-meta">
            ${r.email} · ${r.reason || "No reason"} ·
            ${new Date(r.created_at).toLocaleString()}
          </div>
        </div>
        <div class="card-actions">
          ${r.status === "pending" ? `
            <button class="btn btn-approve" onclick="approveAccess(${r.id}, this)">Approve</button>
            <button class="btn btn-reject" onclick="rejectAccess(${r.id})">Reject</button>
          ` : ""}
        </div>
      </div>
    `).join("")}</div>`;
    }

    async function approveAccess(id, btn) {
      if (!confirm("Approve and send credentials?")) return;
      btn.disabled = true; btn.textContent = "Approving...";
      const res = await fetch(`${CONFIG.API_BASE}/api/access/approve/${id}`, {
        method: "POST", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? "✅ " + data.message : "❌ " + data.message);
      if (data.success) { loadAccessRequests(); loadStats(); }
      else { btn.disabled = false; btn.textContent = "Approve"; }
    }

    async function rejectAccess(id) {
      if (!confirm("Reject this request?")) return;
      const res = await fetch(`${CONFIG.API_BASE}/api/access/reject/${id}`, {
        method: "POST", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? "Request rejected" : "❌ Error");
      if (data.success) loadAccessRequests();
    }

    // USERS
    async function loadUsers() {
      const res = await fetch(`${CONFIG.API_BASE}/api/admin/users`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById("usersList");

      if (!data.users?.length) {
        list.innerHTML = '<div class="empty-state">No users found</div>'; return;
      }

      list.innerHTML = `<div class="card">${data.users.map(u => `
      <div class="card-row">
        <div class="card-info">
          <div class="card-name">
            ${u.username}
            <span class="badge badge-${u.role}">${u.role}</span>
            ${u.subscribed ? '<span class="badge badge-sub">subscribed</span>' : ''}
          </div>
          <div class="card-meta">
            Joined ${new Date(u.created_at).toLocaleDateString()}
            ${u.subscription_expires ? ` · Expires ${new Date(u.subscription_expires).toLocaleDateString()}` : ""}
          </div>
        </div>
        <div class="card-actions">
          ${u.role !== "admin" ? `
            ${!u.subscribed
            ? `<button class="btn btn-sub" onclick="toggleSub(${u.id}, true)">+ Subscribe</button>`
            : `<button class="btn btn-unsub" onclick="toggleSub(${u.id}, false)">Remove Sub</button>`
          }
            <button class="btn btn-delete" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>
          ` : '<span style="color:#333;font-size:12px">Protected</span>'}
        </div>
      </div>
    `).join("")}</div>`;
    }

    async function toggleSub(id, subscribe) {
      const action = subscribe ? "subscribe" : "unsubscribe";
      const res = await fetch(`${CONFIG.API_BASE}/api/admin/users/${id}/${action}`, {
        method: "POST", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? data.message : "❌ Error");
      if (data.success) { loadUsers(); loadStats(); }
    }

    async function deleteUser(id, username) {
      if (!confirm(`Delete "${username}"? This cannot be undone.`)) return;
      const res = await fetch(`${CONFIG.API_BASE}/api/admin/users/${id}`, {
        method: "DELETE", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? `"${username}" deleted` : "❌ Error");
      if (data.success) { loadUsers(); loadStats(); }
    }

    // VIDEO REQUESTS
    async function loadVideoRequests() {
      const res = await fetch(`${CONFIG.API_BASE}/api/videorequests/all`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById("videoReqsList");

      if (!data.requests?.length) {
        list.innerHTML = '<div class="empty-state">No video requests</div>'; return;
      }

      list.innerHTML = `<div class="card">${data.requests.map(r => `
      <div class="card-row">
        <div class="card-info">
          <div class="card-name">
            ${r.title}
            <span class="badge badge-${r.status}">${r.status}</span>
          </div>
          <div class="card-meta">
            From: ${r.submitted_by} · ${r.request_type === "file" ? "File Upload" : "Link"} ·
            ${new Date(r.created_at).toLocaleString()}
            ${r.video_link ? `· <a href="${r.video_link}" target="_blank"
              style="color:#888aff">View Link</a>` : ""}
            ${r.description ? `<br>${r.description}` : ""}
          </div>
        </div>
        <div class="card-actions">
          ${r.status === "pending" ? `
            <button class="btn btn-approve"
              onclick="approveVideoReq(${r.id}, this)">Approve</button>
            <button class="btn btn-reject"
              onclick="rejectVideoReq(${r.id}, this)">Reject</button>
          ` : ""}
        </div>
      </div>
    `).join("")}</div>`;
    }

    async function approveVideoReq(id, btn) {
      const note = prompt("Add a note for the user (optional):");
      btn.disabled = true;
      const res = await fetch(`${CONFIG.API_BASE}/api/videorequests/approve/${id}`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ admin_note: note || "" })
      });
      const data = await res.json();
      showToast(data.success ? "Request approved" : "❌ Error");
      if (data.success) { loadVideoRequests(); loadStats(); }
      else btn.disabled = false;
    }

    async function rejectVideoReq(id, btn) {
      const note = prompt("Reason for rejection (optional):");
      btn.disabled = true;
      const res = await fetch(`${CONFIG.API_BASE}/api/videorequests/reject/${id}`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ admin_note: note || "" })
      });
      const data = await res.json();
      showToast(data.success ? "Request rejected" : "❌ Error");
      if (data.success) { loadVideoRequests(); loadStats(); }
      else btn.disabled = false;
    }

    // MESSAGES
    async function loadMessages() {
      const res = await fetch(`${CONFIG.API_BASE}/api/requests`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById("messagesList");

      if (!data.requests?.length) {
        list.innerHTML = '<div class="empty-state">No messages</div>'; return;
      }

      list.innerHTML = `<div class="card">${data.requests.map(r => `
      <div class="card-row">
        <div class="card-info">
          <div class="card-name">
            ${r.submitted_by}
            <span class="badge badge-${r.status === "seen" ? "seen" : "pending"}">
              ${r.status}
            </span>
          </div>
          <div class="card-meta">
            ${r.message}<br>
            ${new Date(r.created_at).toLocaleString()}
          </div>
        </div>
        <div class="card-actions">
          ${r.status === "pending" ? `
            <button class="btn btn-seen" onclick="markSeen(${r.id})">Mark Seen</button>
          ` : ""}
        </div>
      </div>
    `).join("")}</div>`;
    }

    async function markSeen(id) {
      const res = await fetch(`${CONFIG.API_BASE}/api/requests/${id}/seen`, {
        method: "PATCH", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? "Marked as seen" : "❌ Error");
      if (data.success) loadMessages();
    }

    async function loadSubRequests() {
      const res = await fetch(`${CONFIG.API_BASE}/api/admin/subscription-requests`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById("subRequestsList");

      if (!data.requests?.length) {
        list.innerHTML = '<div class="empty-state">No subscription requests</div>'; return;
      }

      list.innerHTML = `<div class="card">${data.requests.map(r => `
      <div class="card-row">
        <div class="card-info">
          <div class="card-name">
            ${r.username}
            <span class="badge badge-${r.status}">${r.status}</span>
            ${r.subscribed ? '<span class="badge badge-sub">subscribed</span>' : ''}
          </div>
          <div class="card-meta">
            Requested: ${new Date(r.created_at).toLocaleString()}<br>
            Payment of 50₹/month — confirm receipt before approving
          </div>
        </div>
        <div class="card-actions">
          ${r.status === "pending" ? `
            <button class="btn btn-approve"
              onclick="approveSub(${r.user_id}, this)">Approve</button>
            <button class="btn btn-reject"
              onclick="rejectSub(${r.id}, this)">Reject</button>
          ` : ""}
        </div>
      </div>
    `).join("")}</div>`;
    }

    async function approveSub(userId, btn) {
      if (!confirm("Confirm payment received and activate subscription?")) return;
      btn.disabled = true;
      const res = await fetch(`${CONFIG.API_BASE}/api/admin/users/${userId}/subscribe`, {
        method: "POST", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? "✅ Subscription activated!" : "❌ Error");
      if (data.success) { loadSubRequests(); loadStats(); }
      else btn.disabled = false;
    }

    async function rejectSub(id, btn) {
      if (!confirm("Reject this subscription request?")) return;
      btn.disabled = true;
      const res = await fetch(`${CONFIG.API_BASE}/api/admin/subscription-requests/${id}/reject`, {
        method: "POST", headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      showToast(data.success ? "Request rejected" : "❌ Error");
      if (data.success) loadSubRequests();
      else btn.disabled = false;
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }

    loadStats();
    loadAccessRequests();
  </script>

</body>

</html>
