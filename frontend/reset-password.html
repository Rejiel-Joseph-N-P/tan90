<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tan90 — Reset Password</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap");
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", sans-serif; background: #080808; color: #fff;
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background-image: radial-gradient(ellipse at 50% 0%, #1a1a1a 0%, #080808 70%);
    }
    .wrapper { width: 100%; max-width: 420px; padding: 24px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand-logo {
      font-size: 36px; font-weight: 700; letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-tagline { color: #555; font-size: 13px; margin-top: 6px; }
    .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 36px; }
    .card h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .card p { color: #555; font-size: 13px; margin-bottom: 28px; }
    label {
      display: block; font-size: 12px; font-weight: 500; color: #888;
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .input-wrapper { position: relative; margin-bottom: 16px; }
    input {
      width: 100%; padding: 13px 48px 13px 16px; background: #1a1a1a;
      border: 1px solid #2a2a2a; border-radius: 10px; color: #fff;
      font-size: 14px; font-family: "Space Grotesk", sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #444; }
    input::placeholder { color: #444; }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #555;
      display: flex; align-items: center; transition: color 0.2s;
    }
    .eye-btn:hover { color: #aaa; }
    .btn {
      width: 100%; padding: 14px; background: #fff; color: #000; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      font-family: "Space Grotesk", sans-serif; cursor: pointer;
      margin-top: 8px; transition: background 0.2s;
    }
    .btn:hover { background: #e8e8e8; }
    .btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
    .error-box {
      background: #1a0a0a; border: 1px solid #3a1a1a; color: #ff6b6b;
      padding: 12px 16px; border-radius: 10px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .success-view { text-align: center; display: none; }
    .success-icon {
      width: 64px; height: 64px; background: #0a2a0a; border: 2px solid #1a4a1a;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 20px;
    }
    .login-link {
      display: inline-block; margin-top: 20px; background: #fff; color: #000;
      padding: 12px 28px; border-radius: 10px; font-size: 14px;
      font-weight: 600; text-decoration: none;
    }
    .invalid-view { text-align: center; }
  
/* Eye button alignment fix */
.eye-btn {
  position: absolute !important;
  right: 14px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  min-height: unset !important;
  height: auto !important;
  width: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  background: none !important;
  border: none !important;
}

.password-wrapper {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
}

.password-wrapper input {
  padding-right: 48px !important;
  width: 100% !important;
}

  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <div class="brand-logo">tan90</div>
      <div class="brand-tagline">Private Video Platform</div>
    </div>
    <div class="card">

      <!-- INVALID TOKEN -->
      <div class="invalid-view" id="invalidView" style="display:none">
        <h2 style="color:#ff6b6b;margin-bottom:10px">Invalid Link</h2>
        <p>This password reset link is invalid or has expired. Please request a new one.</p>
        <a href="forgot-password.html" style="display:inline-block;margin-top:20px;color:#888;font-size:13px">Request new link →</a>
      </div>

      <!-- RESET FORM -->
      <div id="formView">
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>
        <div class="error-box" id="errorBox"></div>

        <label>New Password</label>
        <div class="input-wrapper">
          <input type="password" id="newPassword" placeholder="Enter new password" />
          <button class="eye-btn" type="button"
            onclick="toggleEye('newPassword','r1open','r1closed')">
            <svg id="r1open" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="r1closed" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <label>Confirm New Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" />
          <button class="eye-btn" type="button"
            onclick="toggleEye('confirmPassword','r2open','r2closed')">
            <svg id="r2open" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="r2closed" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <button class="btn" id="resetBtn" onclick="resetPassword()">Set New Password</button>
      </div>

      <!-- SUCCESS -->
      <div class="success-view" id="successView">
        <div class="success-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
            viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2 style="margin-bottom:10px">Password Reset!</h2>
        <p>Your password has been updated successfully.</p>
        <a href="login.html" class="login-link">Sign In Now</a>
      </div>

    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.getElementById("formView").style.display = "none";
      document.getElementById("invalidView").style.display = "block";
    }

    function toggleEye(inputId, openId, closedId) {
      const input = document.getElementById(inputId);
      document.getElementById(openId).style.display =
        input.type === "password" ? "none" : "block";
      document.getElementById(closedId).style.display =
        input.type === "password" ? "block" : "none";
      input.type = input.type === "password" ? "text" : "password";
    }

    async function resetPassword() {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorBox = document.getElementById("errorBox");
      const btn = document.getElementById("resetBtn");

      errorBox.style.display = "none";

      if (!newPassword || newPassword.length < 6) {
        errorBox.textContent = "Password must be at least 6 characters";
        errorBox.style.display = "block";
        return;
      }

      if (newPassword !== confirmPassword) {
        errorBox.textContent = "Passwords do not match";
        errorBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting...";

      try {
        const res = await fetch(`${CONFIG.API_BASE}/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: newPassword })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById("formView").style.display = "none";
          document.getElementById("successView").style.display = "block";
        } else {
          if (data.message.includes("Invalid or expired")) {
            document.getElementById("formView").style.display = "none";
            document.getElementById("invalidView").style.display = "block";
          } else {
            errorBox.textContent = data.message;
            errorBox.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Set New Password";
          }
        }
      } catch (err) {
        errorBox.textContent = "Cannot connect to server";
        errorBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Set New Password";
      }
    }
  </script>
</body>
</html>
