<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tan90 — My Dashboard</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap");
    @import url("https://db.onlinewebfonts.com/c/2427d7acdb15d5c064b9ced748f0da75?family=LED+Dot-Matrix");
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Space Grotesk", sans-serif; background: #080808; color: #fff; min-height: 100vh; }

    nav {
      background: #111; border-bottom: 1px solid #1e1e1e;
      padding: 16px 32px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }

    .nav-brand {
      font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-decoration: none;
    }

    .nav-brand span { -webkit-text-fill-color: #555; font-size: 13px; font-weight: 400; margin-left: 8px; }

    .nav-right { display: flex; align-items: center; gap: 8px; }

    .nav-btn {
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #888;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-family: "Space Grotesk", sans-serif;
      text-decoration: none; transition: all 0.2s;
    }

    .nav-btn:hover { background: #222; color: #fff; }

    main { padding: 32px; max-width: 1100px; margin: 0 auto; }

    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .page-subtitle { color: #555; font-size: 14px; margin-bottom: 32px; }

    .sub-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0a2a0a; border: 1px solid #1a4a1a;
      color: #4caf50; padding: 6px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 600; margin-bottom: 32px;
    }

    /* UPLOAD PANEL */
    .upload-card {
      background: #111; border: 1px solid #1e1e1e;
      border-radius: 16px; padding: 28px; margin-bottom: 32px;
    }

    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #555; margin-bottom: 20px; }

    .upload-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;
    }

    input, textarea {
      width: 100%; padding: 12px 16px; background: #1a1a1a;
      border: 1px solid #2a2a2a; border-radius: 10px; color: #fff;
      font-size: 14px; font-family: "Space Grotesk", sans-serif;
      outline: none; transition: border-color 0.2s;
    }

    input:focus, textarea:focus { border-color: #444; }
    input::placeholder, textarea::placeholder { color: #444; }

    .file-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }

    .file-label {
      background: #1a1a1a; border: 1px dashed #333; border-radius: 8px;
      padding: 10px 16px; color: #666; font-size: 13px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }

    .file-label:hover { border-color: #555; color: #aaa; }
    #subVideoFile { display: none; }

    .upload-btn {
      background: #fff; color: #000; border: none; padding: 11px 24px;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      font-family: "Space Grotesk", sans-serif; cursor: pointer;
      white-space: nowrap; transition: background 0.2s;
    }

    .upload-btn:hover { background: #e8e8e8; }
    .upload-btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
    .upload-status { font-size: 13px; color: #666; }

    /* VIDEO GRID */
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }

    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    }

    .video-card {
      background: #111; border: 1px solid #1e1e1e; border-radius: 12px;
      overflow: hidden; transition: border-color 0.2s, transform 0.2s;
    }

    .video-card:hover { border-color: #333; transform: translateY(-2px); }

    .video-thumb {
      background: #161616; height: 160px; display: flex;
      align-items: center; justify-content: center; position: relative;
    }

    .play-icon {
      width: 48px; height: 48px; background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .video-info { padding: 14px; }
    .video-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .video-meta { font-size: 12px; color: #444; margin-bottom: 12px; }

    .delete-btn {
      background: #2a0f0f; border: 1px solid #4a1a1a; color: #ff6b6b;
      padding: 6px 14px; border-radius: 6px; font-size: 12px;
      font-family: "Space Grotesk", sans-serif; cursor: pointer;
      transition: background 0.2s;
    }

    .delete-btn:hover { background: #3a1a1a; }

    .empty-state { text-align: center; padding: 60px 0; color: #333; font-size: 14px; }
  
/* Eye button alignment fix */
.eye-btn {
  position: absolute !important;
  right: 14px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  min-height: unset !important;
  height: auto !important;
  width: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  background: none !important;
  border: none !important;
}

.password-wrapper {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
}

.password-wrapper input {
  padding-right: 48px !important;
  width: 100% !important;
}

  


  
/* LED Dot-Matrix for video titles */
.video-title, .video-title-large {
  font-family: "LED Dot-Matrix", monospace !important;
  letter-spacing: 1px !important;
}

  </style>
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">tan90 <span>My Dashboard</span></a>
  <div class="nav-right">
    <a href="index.html" class="nav-btn">Browse Videos</a>
    <a href="profile.html" class="nav-btn">Profile</a>
    <button class="nav-btn" onclick="logout()">Sign Out</button>
  </div>
</nav>

<main>
  <div class="page-title">My Dashboard</div>
  <div class="page-subtitle">Upload and manage your videos on tan90</div>
  <div class="sub-badge">
    ✓ Active Subscriber · Expires <span id="expiryDate">—</span>
  </div>

  <!-- UPLOAD PANEL -->
  <div class="upload-card">
    <div class="card-title">Upload a Video</div>
    <div class="card-desc">Upload your video to the tan90 platform. All uploads are reviewed by admin.</div>

    <div class="upload-grid">
      <input type="text" id="subTitle" placeholder="Video title" />
      <input type="text" id="subCategory" placeholder="Category (e.g. Tutorial)" />
      <input type="text" id="subDesc" placeholder="Description" />
      <input type="text" id="subTags" placeholder="Tags (comma separated)" />
    </div>

    <div class="file-row">
      <label class="file-label" for="subVideoFile" id="subFileLabel">Choose video file...</label>
      <input type="file" id="subVideoFile" accept="video/*" onchange="updateLabel(this)" />
      <button class="upload-btn" id="subUploadBtn" onclick="uploadVideo()">Upload</button>
      <span class="upload-status" id="subUploadStatus"></span>
    </div>
  </div>

  <!-- MY VIDEOS -->
  <div class="section-title">My Videos</div>
  <div class="video-grid" id="myVideoGrid">
    <div class="empty-state">Loading your videos...</div>
  </div>
</main>
<script>
  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if (!token) window.location.href = "login.html";

  async function checkSubscription() {
    const res = await fetch(`${CONFIG.API_BASE}/api/admin/my-subscription`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    if (!data.subscribed) {
      window.location.href = "profile.html";
      return;
    }
    if (data.subscription_expires) {
      document.getElementById("expiryDate").textContent =
        new Date(data.subscription_expires).toLocaleDateString();
    }
  }

  function updateLabel(input) {
    document.getElementById("subFileLabel").textContent =
      input.files[0] ? input.files[0].name : "Choose video file...";
  }

  async function uploadVideo() {
    const title = document.getElementById("subTitle").value.trim();
    const desc = document.getElementById("subDesc").value.trim();
    const category = document.getElementById("subCategory").value.trim();
    const tags = document.getElementById("subTags").value.trim();
    const file = document.getElementById("subVideoFile").files[0];
    const status = document.getElementById("subUploadStatus");
    const btn = document.getElementById("subUploadBtn");

    if (!title) { status.textContent = "Please enter a title"; return; }
    if (!file) { status.textContent = "Please select a file"; return; }

    const formData = new FormData();
    formData.append("video", file);
    formData.append("title", title);
    formData.append("description", desc);
    formData.append("category", category || "General");
    formData.append("tags", tags);

    btn.disabled = true;
    status.textContent = "Uploading...";

    try {
      const res = await fetch(`${CONFIG.API_BASE}/api/videos/upload-subscriber`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        status.textContent = "Uploaded!";
        document.getElementById("subTitle").value = "";
        document.getElementById("subDesc").value = "";
        document.getElementById("subCategory").value = "";
        document.getElementById("subTags").value = "";
        document.getElementById("subVideoFile").value = "";
        document.getElementById("subFileLabel").textContent = "Choose video file...";
        setTimeout(() => { status.textContent = ""; }, 3000);
        loadMyVideos();
      } else {
        status.textContent = data.message;
      }
    } catch (err) {
      status.textContent = "Upload failed";
    } finally {
      btn.disabled = false;
    }
  }

  async function loadMyVideos() {
    const res = await fetch(`${CONFIG.API_BASE}/api/videos/my-videos`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    const grid = document.getElementById("myVideoGrid");

    if (!data.videos || data.videos.length === 0) {
      grid.innerHTML = '<div class="empty-state">No videos uploaded yet</div>';
      return;
    }

    grid.innerHTML = data.videos.map(v => `
      <div class="video-card">
        <a href="watch.html?id=${v.id}&filename=${encodeURIComponent(v.filename)}"
           style="text-decoration:none;color:inherit">
          <div class="video-thumb" style="${v.thumbnail ? `background-image:url('${CONFIG.API_BASE}/api/videos/thumbnail/${v.thumbnail}');background-size:cover;background-position:center` : ''}">
            <div class="play-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                viewBox="0 0 24 24" fill="white" stroke="none">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
            </div>
          </div>
        </a>
        <div class="video-info">
          <div class="video-title">${v.title}</div>
          <div class="video-meta">${new Date(v.created_at).toLocaleDateString()}</div>
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid #222;display:flex;gap:10px">
            <input type="file" id="thumb-${v.id}" accept="image/*" style="display:none" onchange="uploadThumbnail(${v.id}, this)">
            <button class="delete-btn" onclick="document.getElementById('thumb-${v.id}').click()" style="background:#1a1a1a;border-color:#2a2a2a;color:#fff">Set Thumb</button>
            <button class="delete-btn" onclick="deleteVideo(${v.id}, '${v.title}')">Delete</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  async function deleteVideo(id, title) {
    if (!confirm(`Delete "${title}"?`)) return;
    const res = await fetch(`${CONFIG.API_BASE}/api/videos/${id}`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    if (data.success) loadMyVideos();
  }

  async function uploadThumbnail(id, input) {
    if (!input.files[0]) return;
    const formData = new FormData();
    formData.append("thumbnail", input.files[0]);
    try {
      const res = await fetch(`${CONFIG.API_BASE}/api/videos/thumbnail/${id}`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        loadMyVideos();
      } else {
        alert(data.message || "Thumbnail upload failed");
      }
    } catch (err) {
      alert("Upload failed");
    }
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
  }

  checkSubscription();
  loadMyVideos();
</script>

</body>
</html>
